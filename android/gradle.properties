org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
android.useAndroidX=false
android.nonTransitiveRClass=true
kotlin.code.style=official

# Where the player library lives, relative to this folder. Clone
# SOOB-Core-Android as a sibling of the game repo:
#
#   Games/
#   ├── Find5/             ← this repo
#   │   └── android/       ← you are here
#   ├── SOOB-Core/
#   └── SOOB-Core-Android/
#
# Read by settings.gradle (includeBuild) and by app/build.gradle (soobApp).
soobPlayer=../../SOOB-Core-Android

# The game bundle this module packages — the repo root, one level up. Read by
# SOOB-Core-Android's syncGame.gradle, which copies scripts/, assets/,
# assets.lua and app.lua into app/src/main/assets/game and generates the
# launcher label and icon colour from app.lua.
soobGame=..
