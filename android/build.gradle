// Versions must match SOOB-Core-Android's root build.gradle: a composite build
// loads the Android and Kotlin plugins once, and disagreeing versions across
// the two builds fail at configuration time.
plugins {
    id 'com.android.application' version '8.13.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.10' apply false
}
